<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ava — Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="library-body">
  <header class="library-top">
    <a class="library-brand" href="index.html">
      <span class="stage__logo">Ava</span>
      <span class="stage__tag">Account</span>
    </a>
    <div class="library-top__actions">
      <a class="btn btn--ghost btn--small" href="index.html">Home</a>
      <a class="btn btn--ghost btn--small" href="studio.html">Studio</a>
      <a class="btn btn--ghost btn--small" href="library.html">Library</a>
      <button type="button" class="btn btn--ghost btn--small" id="btnAccountSignIn">Sign in</button>
    </div>
  </header>

  <main class="library-main account-main">
    <div class="library-intro">
      <h1>Account</h1>
      <p class="help" id="accountLead">Your profile, plan, and password.</p>
    </div>
    <p class="library-status" id="accountStatus" aria-live="polite"></p>

    <section class="account-gate" id="accountGate">
      <p>Sign in to view your account.</p>
    </section>

    <div class="account-grid" id="accountGrid" hidden>
      <section class="account-card">
        <h2>Profile</h2>
        <form id="profileForm" class="auth-form">
          <div class="auth-field">
            <label class="label" for="accountName">Name</label>
            <input id="accountName" class="text-input" type="text" name="name" maxlength="80" autocomplete="name" required />
          </div>
          <div class="auth-field">
            <label class="label" for="accountEmail">Email</label>
            <input id="accountEmail" class="text-input" type="email" readonly />
          </div>
          <p class="help" id="accountSince"></p>
          <div class="account-card__actions">
            <button type="submit" class="btn btn--primary" id="btnSaveProfile">Save name</button>
          </div>
        </form>
      </section>

      <section class="account-card">
        <h2>Plan</h2>
        <p class="account-plan" id="accountPlan">Free</p>
        <p class="help" id="accountPlanHelp">Your current Ava plan.</p>
        <div class="account-card__actions">
          <a class="btn btn--ghost" href="index.html#plans">See plans</a>
          <button type="button" class="btn btn--primary" id="btnUpgradePro">Upgrade to Pro</button>
          <button type="button" class="btn btn--ghost" id="btnManageBilling">Manage billing</button>
        </div>
      </section>

      <section class="account-card">
        <h2>Password</h2>
        <form id="passwordForm" class="auth-form">
          <div class="auth-field">
            <label class="label" for="currentPassword">Current password</label>
            <input id="currentPassword" class="text-input" type="password" name="currentPassword" autocomplete="current-password" required />
          </div>
          <div class="auth-field">
            <label class="label" for="newPassword">New password</label>
            <input id="newPassword" class="text-input" type="password" name="password" minlength="6" autocomplete="new-password" required />
          </div>
          <div class="account-card__actions">
            <button type="submit" class="btn btn--primary" id="btnSavePassword">Update password</button>
          </div>
        </form>
      </section>

      <section class="account-card">
        <h2>Session</h2>
        <p class="help">Sign out of this browser. Your library and saves stay in your account.</p>
        <div class="account-card__actions">
          <button type="button" class="btn btn--ghost" id="btnAccountSignOut">Sign out</button>
        </div>
      </section>
    </div>
  </main>

  <dialog class="auth-dialog" id="authDialog">
    <div class="auth-dialog__inner">
      <h2 class="auth-dialog__title" id="authTitle">Sign in</h2>
      <p class="help" id="authHelp">Sign in to your Ava account.</p>
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" data-mode="signin" id="tabSignin">Sign in</button>
        <button type="button" class="auth-tab" data-mode="signup" id="tabSignup">Sign up</button>
      </div>
      <form id="authForm" class="auth-form" autocomplete="on">
        <div class="auth-field" id="authNameField" hidden>
          <label class="label" for="authName">Name</label>
          <input id="authName" class="text-input" type="text" name="name" maxlength="80" autocomplete="name" />
        </div>
        <div class="auth-field">
          <label class="label" for="authEmail">Email</label>
          <input id="authEmail" class="text-input" type="email" name="email" required autocomplete="email" />
        </div>
        <div class="auth-field">
          <label class="label" for="authPassword">Password</label>
          <input id="authPassword" class="text-input" type="password" name="password" required minlength="6" autocomplete="current-password" />
        </div>
        <p class="auth-error" id="authError" hidden></p>
        <div class="auth-dialog__actions">
          <button type="submit" class="btn btn--primary" id="authSubmit">Sign in</button>
          <button type="button" class="btn btn--ghost" id="authCancel">Close</button>
        </div>
      </form>
    </div>
  </dialog>

  <script type="module" src="js/account.js"></script>
</body>
</html>
